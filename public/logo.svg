<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 성수고 로고 재현: 중앙 高, 바깥 원, 위 잎 / 좌우 벚잎 느낌 -->
  <g fill="none" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 바깥 원 -->
    <circle cx="100" cy="105" r="62" stroke-width="6"/>
    <!-- 위 장식 - 잎 모양 -->
    <path d="M100 8 L112 28 L108 38 L118 48 L100 62 L82 48 L92 38 L88 28 Z" fill="#ffffff" stroke-width="4"/>
    <!-- 잎 안쪽 선 -->
    <path d="M100 15 L100 62" stroke-width="2.5"/>
    <path d="M100 30 L108 38 M100 30 L92 38" stroke-width="2"/>
    <!-- 하단 장식 -->
    <path d="M62 168 C78 180 122 180 138 168" stroke-width="5" fill="none"/>
    <path d="M96 172 L100 188 L104 172" fill="#1e3a8a" stroke="none"/>
    <!-- 좌측 잎 -->
    <g transform="translate(18,95)">
      <path d="M32 0 C12 -8 0 8 8 22 C4 18 0 24 6 34 C2 32 -2 40 10 44 C6 42 8 50 20 46 L32 28 Z" fill="white" stroke-width="3.5"/>
      <path d="M10 14 L28 26 M14 22 L26 18" stroke-width="1.8"/>
    </g>
    <!-- 우측 잎 -->
    <g transform="translate(150,95) scale(-1,1) translate(-32,0)">
      <path d="M32 0 C12 -8 0 8 8 22 C4 18 0 24 6 34 C2 32 -2 40 10 44 C6 42 8 50 20 46 L32 28 Z" fill="white" stroke-width="3.5"/>
      <path d="M10 14 L28 26 M14 22 L26 18" stroke-width="1.8"/>
    </g>
    <!-- 좌우 상단 작은 원 장식 -->
    <circle cx="38" cy="72" r="6" fill="white" stroke-width="3"/>
    <circle cx="162" cy="72" r="6" fill="white" stroke-width="3"/>
  </g>
  <!-- 중앙 高 글자 -->
  <g fill="#1e3a8a" font-family="serif" font-weight="900" text-anchor="middle">
    <text x="100" y="98" font-size="54" letter-spacing="2">高</text>
    <!-- 高 아래 작은 사각 -->
    <rect x="85" y="108" width="30" height="18" fill="none" stroke="#1e3a8a" stroke-width="3.5"/>
    <rect x="91" y="113" width="18" height="8" fill="#1e3a8a"/>
  </g>
</svg>
