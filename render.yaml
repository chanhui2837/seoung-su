services:
  - type: web
    name: seongsu-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
    disk:
      name: seongsu-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    # 업로드는 data 디스크 안에 있으므로 별도 디스크 불필요 (uploads는 data와 함께 유지)
    # Render Free는 디스크 미지원 - Starter($7) 이상 필요. Free에서는 외부 DB 권장
