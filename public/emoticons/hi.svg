<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="white" stroke="#1e3a8a" stroke-width="3"/>
  <circle cx="50" cy="52" r="32" fill="#fef3c7" stroke="#1e3a8a" stroke-width="2"/>
  <!-- 高 emblem on forehead -->
  <g transform="translate(50,18)">
    <circle r="10" fill="white" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="900" fill="#1e3a8a" font-family="serif">高</text>
  </g>
  <!-- eyes -->
  <circle cx="38" cy="48" r="4" fill="#1e3a8a"/><circle cx="62" cy="48" r="4" fill="#1e3a8a"/>
  <circle cx="39.5" cy="47" r="1.2" fill="white"/><circle cx="63.5" cy="47" r="1.2" fill="white"/>
  <!-- blush -->
  <ellipse cx="28" cy="58" rx="4" ry="2.5" fill="#f9a8d4" opacity="0.6"/><ellipse cx="72" cy="58" rx="4" ry="2.5" fill="#f9a8d4" opacity="0.6"/>
  <!-- smile -->
  <path d="M42 62 Q50 68 58 62" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round"/>
  <!-- waving hand -->
  <g transform="translate(78,38) rotate(-20)">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#fef3c7" stroke="#1e3a8a" stroke-width="1.5"/>
    <path d="M-4 -2 L-2 -6 M0 -3 L2 -7 M4 -2 L5 -6" stroke="#1e3a8a" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>
  <!-- text -->
  <text x="50" y="88" text-anchor="middle" font-size="7" font-weight="700" fill="#1e3a8a">하이</text>
</svg>
