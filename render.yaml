services:
  - type: web
    name: seongsu-portal
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
        # Render 대시보드 -> Environment -> MONGODB_URI 에 MongoDB Atlas 연결 문자열을 입력하세요.
      - key: JWT_SECRET
        sync: false