<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="45" fill="white" stroke="#1e3a8a" stroke-width="3"/>
  <!-- sunflower -->
  <g transform="translate(50,42)">
    <!-- petals -->
    <g fill="#facc15" stroke="#1e3a8a" stroke-width="1">
      <ellipse cx="0" cy="-18" rx="7" ry="10"/>
      <ellipse cx="0" cy="18" rx="7" ry="10"/>
      <ellipse cx="-18" cy="0" rx="10" ry="7"/>
      <ellipse cx="18" cy="0" rx="10" ry="7"/>
      <ellipse cx="-13" cy="-13" rx="8" ry="7" transform="rotate(-45 -13 -13)"/>
      <ellipse cx="13" cy="-13" rx="8" ry="7" transform="rotate(45 13 -13)"/>
      <ellipse cx="-13" cy="13" rx="8" ry="7" transform="rotate(45 -13 13)"/>
      <ellipse cx="13" cy="13" rx="8" ry="7" transform="rotate(-45 13 13)"/>
    </g>
    <circle r="11" fill="#92400e" stroke="#1e3a8a" stroke-width="1.2"/>
    <!-- face -->
    <circle cx="-3.5" cy="-2" r="1.5" fill="white"/><circle cx="3.5" cy="-2" r="1.5" fill="white"/>
    <circle cx="-3.5" cy="-2" r="0.8" fill="#1e3a8a"/><circle cx="3.5" cy="-2" r="0.8" fill="#1e3a8a"/>
    <path d="M-3 3 Q0 5 3 3" fill="none" stroke="white" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- 高 badge on stem -->
  <g transform="translate(50,70)">
    <rect x="-10" y="-6" width="20" height="12" rx="6" fill="#1e3a8a"/>
    <text x="0" y="3" text-anchor="middle" font-size="7" font-weight="900" fill="white" font-family="serif">高</text>
  </g>
  <text x="50" y="88" text-anchor="middle" font-size="6.5" font-weight="700" fill="#1e3a8a">해바라기</text>
</svg>
